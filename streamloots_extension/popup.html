<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Streamloots Gifter</title>
    <style>
      :root {
        color-scheme: dark;
        font: 13px "Segoe UI", system-ui, sans-serif;
        background: #0b1020;
        color: #f4f6ff;
      }
      * { box-sizing: border-box; }
      body { width: 340px; margin: 0; padding: 16px; }
      .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; }
      .logo { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; background: #28345a; color: #aebaff; font-weight: 800; }
      h1 { margin: 0; font-size: 15px; letter-spacing: .1px; }
      .subtitle { margin: 3px 0 0; color: #8d9ab3; font-size: 11px; }
      .card { padding: 13px; border: 1px solid #26324a; border-radius: 13px; background: #151d30; }
      .status { display: flex; align-items: flex-start; gap: 9px; margin-bottom: 13px; }
      .dot { flex: none; width: 9px; height: 9px; margin-top: 4px; border-radius: 50%; background: #e5b94c; box-shadow: 0 0 0 3px #e5b94c22; }
      .dot.connected { background: #35c979; box-shadow: 0 0 0 3px #35c97922; }
      .dot.error { background: #ff8585; box-shadow: 0 0 0 3px #ff858522; }
      #status-title { font-weight: 700; }
      #status-detail { margin-top: 3px; color: #8d9ab3; line-height: 1.4; }
      button { width: 100%; margin-top: 7px; padding: 9px 11px; border: 1px solid transparent; border-radius: 8px; background: #25324a; color: #f4f6ff; font: inherit; font-weight: 600; cursor: pointer; transition: background .15s, transform .15s, opacity .15s; }
      button:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); }
      button:disabled { opacity: .42; cursor: default; }
      #connect { background: #5d6eff; }
      .manual { margin-top: 13px; padding-top: 12px; border-top: 1px solid #26324a; }
      .manual label { display: block; margin: 0 1px 5px; color: #9aa7c0; font-size: 11px; font-weight: 600; }
      .manual input { width: 100%; min-width: 0; padding: 9px 10px; border: 1px solid #26324a; border-radius: 7px; outline: none; background: #0e1525; color: #f4f6ff; font: inherit; }
      .manual input:focus { border-color: #5d6eff; }
      #connect-manual { background: #25324a; }
      #disconnect { background: #202b40; }
      #rotate { margin-top: 12px; background: #392833; color: #ffaaaa; }
      .hint { margin: 12px 2px 0; color: #71809c; font-size: 10px; line-height: 1.45; }
      #toast { min-height: 16px; margin: 8px 2px 0; color: #52db91; font-size: 11px; }
    </style>
  </head>
  <body>
    <header class="brand">
      <div class="logo">S</div>
      <div>
        <h1>Streamloots Gifter</h1>
        <p class="subtitle">Local gifting connection</p>
      </div>
    </header>
    <main class="card">
      <div class="status" role="status" aria-live="polite">
        <span id="status-dot" class="dot"></span>
        <div>
          <div id="status-title">Checking connection…</div>
          <div id="status-detail">Checking the local app and saved key.</div>
        </div>
      </div>
      <button id="connect">Get key &amp; connect</button>
      <div class="manual">
        <label for="manual-key">Bridge key</label>
        <input id="manual-key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste key copied from the app">
        <button id="connect-manual">Connect with key</button>
      </div>
      <button id="disconnect" disabled>Disconnect</button>
      <button id="rotate" disabled>Generate new key</button>
      <div id="toast" aria-live="polite"></div>
    </main>
    <p class="hint">Keep the Streamloots Activity Feed open to detect card redeems, and a creator page open to process gifts. Disconnect removes the saved key from this browser.</p>
    <script src="popup.js"></script>
  </body>
</html>
